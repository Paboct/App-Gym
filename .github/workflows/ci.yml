name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Tests y build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist

  android:
    name: APK de Android (debug)
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - name: Copiar la web al proyecto Android
        run: npx cap sync android
      - name: Compilar el APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar el APK en una dirección fija
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v0.1-base'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk legacy.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima legacy.apk --prerelease --target "$GITHUB_SHA" \
            --title "Legacy · última compilación de prueba" \
            --notes "APK de prueba generado automáticamente desde $GITHUB_REF_NAME ($GITHUB_SHA)."
